name: Contracts

# Compiles the Aiken validators from source on every push/PR and fails the build
# if either compiled blueprint drifts from the hash + CBOR pinned in the app
# (src/lib/vault.ts and src/lib/yield-vault.ts).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-blueprints:
    name: aiken check + blueprint drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Aiken version from aiken.toml
        id: aiken
        run: |
          version=$(grep -E '^compiler\s*=' contracts/vault/aiken.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Aiken $version"

      - name: Install pinned Aiken toolchain
        uses: aiken-lang/setup-aiken@v1
        with:
          version: ${{ steps.aiken.outputs.version }}
          # Use GitHub's short-lived workflow token to avoid unauthenticated
          # release/API requests being throttled by GitHub.
          github-token: ${{ github.token }}

      - name: Run validator tests
        working-directory: contracts/vault
        run: aiken check

      - name: Build blueprint
        working-directory: contracts/vault
        run: aiken build

      - name: Committed plutus.json must equal the fresh build
        run: |
          if ! git diff --quiet -- contracts/vault/plutus.json; then
            echo "::error::contracts/vault/plutus.json is stale — it does not match a clean 'aiken build'."
            git --no-pager diff --stat -- contracts/vault/plutus.json
            echo "Run 'aiken build' in contracts/vault and commit the regenerated plutus.json."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies (verify script needs @noble/hashes)
        run: bun install --frozen-lockfile

      - name: Verify pinned blueprints match plutus.json
        run: node scripts/verify-vault-hash.mjs --strict

      - name: Verify the State datum encoder/decoder round-trip (AUDIT.md O-02)
        run: bun run scripts/verify-state-datum-roundtrip.ts

      - name: Verify published reference script UTxOs are still unspent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BLOCKFROST_PREPROD_PROJECT_ID: ${{ secrets.BLOCKFROST_PREPROD_PROJECT_ID }}
        run: node scripts/verify-ref-scripts.mjs

  verify-susdr-blueprint:
    name: aiken check + blueprint drift guard (susdr-vault)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Aiken version from aiken.toml
        id: aiken
        run: |
          version=$(grep -E '^compiler\s*=' contracts/susdr-vault/aiken.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Aiken $version"

      - name: Install pinned Aiken toolchain
        uses: aiken-lang/setup-aiken@v1
        with:
          version: ${{ steps.aiken.outputs.version }}
          github-token: ${{ github.token }}

      - name: Run validator tests
        working-directory: contracts/susdr-vault
        run: aiken check

      - name: Build blueprint
        working-directory: contracts/susdr-vault
        run: aiken build

      - name: Committed plutus.json must equal the fresh build
        run: |
          if ! git diff --quiet -- contracts/susdr-vault/plutus.json; then
            echo "::error::contracts/susdr-vault/plutus.json is stale — it does not match a clean 'aiken build'."
            git --no-pager diff --stat -- contracts/susdr-vault/plutus.json
            echo "Run 'aiken build' in contracts/susdr-vault and commit the regenerated plutus.json."
            exit 1
          fi
